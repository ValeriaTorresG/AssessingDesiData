<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Spectra Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="./web_view/style.css" rel="stylesheet">
</head>
<body onload="init()">

    <!-- navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
      <div class="container-fluid justify-content-center">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
          <div class="navbar-nav w-100 d-flex justify-content-evenly">
            {% for entry in entries %}
              <a class="nav-link{% if loop.first %} active{% endif %}"
                 href="#{{ entry.night }}"
                 data-target="{{ entry.night }}">
                {{ entry.night }}
              </a>
            {% endfor %}
          </div>
        </div>
      </div>
    </nav>

    <!-- per night -->
    {% for entry in entries %}
      <section id="{{ entry.night }}"{% if not loop.first %} style="display:none"{% endif %}>
        <h1 class="main-title">Night {{ entry.night }}</h1>
        <p class="main-subtitle">Tile {{ entry.tile }}</p>

          <div class="card mb-4">
            <h5 class="card-title">UMAP + FoF</h5>
            <div class="card-body text-center">
                <div>
                    <img src="{{ base_url }}/plots/fibers/fibers_{{ entry.night }}_{{ entry.tile }}.png"
                   class="img-fluid img-tile" alt="tile {{ entry.tile }}">
                </div>
                <div>
                    <img src="{{ base_url }}/plots/umap/umap_{{ entry.tile }}_{{ entry.night }}.png"
                   class="card-img-top" alt="umap {{ entry.tile }}">
                </div>

            </div>
          </div>

          <div class="main-spectra">
            <h5 class="mb-3">Outliers identified</h5>
            <div class="btn-div">
                <a href="{{ base_url }}/text_files/{{ entry.night }}_{{ entry.tile }}.txt"
                    class="btn btn-outline-primary mb-3" target="_blank" rel="noopener">
                    Get text file
                </a>
                <a href="{{ entry.inspector_url }}"
                    class="btn btn-outline-primary mb-3" target="_blank" rel="noopener">
                    DESI Inspector
                </a>
            </div>

            <div class="d-flex flex-wrap gap-2">
              {% for spec in entry.spectra %}
                <img src="{{ base_url }}/plots/spectra/{{ entry.night }}/{{ spec }}"
                     class="spectra-img img-thumbnail" alt="{{ spec }}">
              {% endfor %}
            </div>
          </div>
        </div>
      </section>
    {% endfor %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
      function init() {
        const links = document.querySelectorAll('.nav-link');
        const sections = document.querySelectorAll('section');
        links.forEach(link => {
          link.addEventListener('click', e => {
            e.preventDefault();
            // desactivar todo
            links.forEach(l=>l.classList.remove('active'));
            sections.forEach(s=>s.style.display='none');
            // activar seleccionado
            link.classList.add('active');
            document.getElementById(link.dataset.target).style.display='block';
          });
        });
      }
    </script>
</body>
</html>
